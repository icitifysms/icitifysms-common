[package]
name = "icitifysms-common"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.8"
serde_json = { version = "1.0", features = ["raw_value"] }
serde = { version = "1.0", features = ["derive"] }
utoipa = { version = "5.4.0", features = ["indexmap", "preserve_order", "preserve_path_order", "chrono"] }
indexmap = { version = "2.7.0", features = ["serde"]}
enum-iterator = "1.4.1"
convert_case = "0.6.0"
strum = { version = "0.25", features = ["derive"] }
macros = { git = "https://github.com/icitifysms/icitifysms-macros" }